version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodiebuddy
    ports:
      - "3306:3306"

  discovery-server:
    build: discovery-server
    ports:
      - "8761:8761"

  gateway:
    build: gateway
    ports:
      - "8080:8080"
    depends_on:
      - discovery-server

  user-service:
    build: user-service
    depends_on:
      - mysql
      - kafka
      - discovery-server

  restaurant-service:
    build: restaurant-service
    depends_on:
      - mysql
      - discovery-server

  order-service:
    build: order-service
    depends_on:
      - mysql
      - kafka
      - discovery-server

  payment-service:
    build: payment-service
    depends_on:
      - kafka
      - discovery-server

  delivery-service:
    build: delivery-service
    depends_on:
      - kafka
      - discovery-server

  frontend:
    build: frontend
    ports:
      - "3000:80"
