version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: foodiebuddy
    ports:
      - "3306:3306"

  discovery-server:
    build: discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=foodiebuddy-production-ready-secure-key-32-chars-long
    depends_on:
      discovery-server:
        condition: service_healthy

  user-service:
    build: user-service
    environment:
      - JWT_SECRET=foodiebuddy-production-ready-secure-key-32-chars-long
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy

  restaurant-service:
    build: restaurant-service
    depends_on:
      mysql:
        condition: service_started
      discovery-server:
        condition: service_healthy

  order-service:
    build: order-service
    depends_on:
      mysql:
        condition: service_started
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy

  payment-service:
    build: payment-service
    depends_on:
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy

  delivery-service:
    build: delivery-service
    depends_on:
      kafka:
        condition: service_started
      discovery-server:
        condition: service_healthy

  frontend:
    build: foodiebuddy-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://gateway:8080
