name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  test:
    name: Maven tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - restaurant-service
          - order-service
          - payment-service
          - delivery-service
          - gateway
          - discovery-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Maven tests
        run: mvn -B -f ${{ matrix.service }}/pom.xml test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        service:
          - user-service
          - restaurant-service
          - order-service
          - payment-service
          - delivery-service
          - gateway
          - discovery-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: false
          tags: foodiebuddy/${{ matrix.service }}:${{ github.sha }}
