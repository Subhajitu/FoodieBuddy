{{- if .Values.kafka.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.kafka.name }}
  labels:
    {{- include "foodiebuddy.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  replicas: {{ .Values.kafka.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: kafka
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: kafka
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy }}
          ports:
            - name: kafka
              containerPort: {{ .Values.kafka.service.port }}
            - name: controller
              containerPort: 9093
          env:
            {{- toYaml .Values.kafka.env | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.name }}
  labels:
    {{- include "foodiebuddy.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: kafka
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: kafka
      port: {{ .Values.kafka.service.port }}
      targetPort: {{ .Values.kafka.service.port }}
    - name: controller
      port: 9093
      targetPort: 9093
{{- end }}
