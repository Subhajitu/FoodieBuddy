global:
  imagePullPolicy: IfNotPresent

fullnameOverride: foodiebuddy

kafka:
  enabled: true
  name: kafka
  image:
    repository: bitnami/kafka
    tag: 3.7.0
    pullPolicy: IfNotPresent
  replicas: 1
  service:
    port: 9092
  env:
    - name: KAFKA_CFG_NODE_ID
      value: "0"
    - name: KAFKA_CFG_PROCESS_ROLES
      value: controller,broker
    - name: KAFKA_CFG_CONTROLLER_QUORUM_VOTERS
      value: 0@kafka:9093
    - name: KAFKA_CFG_LISTENERS
      value: PLAINTEXT://:9092,CONTROLLER://:9093
    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: PLAINTEXT://kafka:9092
    - name: KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
      value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    - name: KAFKA_CFG_CONTROLLER_LISTENER_NAMES
      value: CONTROLLER
    - name: KAFKA_CFG_INTER_BROKER_LISTENER_NAME
      value: PLAINTEXT
    - name: ALLOW_PLAINTEXT_LISTENER
      value: "yes"

services:
  discovery-server:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/discovery-server
      tag: latest
    service:
      type: ClusterIP
      port: 8761
      targetPort: 8761
    env: []

  gateway:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/gateway
      tag: latest
    service:
      type: LoadBalancer
      port: 8080
      targetPort: 8080
    env:
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://foodiebuddy-discovery-server:8761/eureka

  user-service:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/user-service
      tag: latest
    service:
      type: ClusterIP
      port: 8081
      targetPort: 8080
    env:
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://foodiebuddy-discovery-server:8761/eureka

  restaurant-service:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/restaurant-service
      tag: latest
    service:
      type: ClusterIP
      port: 8082
      targetPort: 8080
    env:
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://foodiebuddy-discovery-server:8761/eureka

  order-service:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/order-service
      tag: latest
    service:
      type: ClusterIP
      port: 8083
      targetPort: 8080
    env:
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://foodiebuddy-discovery-server:8761/eureka

  payment-service:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/payment-service
      tag: latest
    service:
      type: ClusterIP
      port: 8084
      targetPort: 8080
    env:
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://foodiebuddy-discovery-server:8761/eureka

  delivery-service:
    enabled: true
    replicas: 1
    image:
      repository: foodiebuddy/delivery-service
      tag: latest
    service:
      type: ClusterIP
      port: 8085
      targetPort: 8080
    env:
      - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
        value: kafka:9092
      - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
        value: http://foodiebuddy-discovery-server:8761/eureka
